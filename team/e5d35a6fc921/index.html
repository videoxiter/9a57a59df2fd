, "kpi": {"quality": 9, "learnability": 10, "initiative": 10, "engagement": 10, "discipline": 8}, "avg": 9.4, "rank": 1, "strengths": [["Обучаемость 10/10", "Быстро осваиваешь новое и не повторяешь одних и тех же ошибок"], ["Инициатива 10/10", "Сам берёшь задачи и предлагаешь улучшения — проактивность"], ["Вовлечённость 10/10", "Командный игрок: на тебя можно положиться, помогаешь коллегам"], ["Качество 9/10", "Задачи делаешь сразу верно — без возвратов и рекламаций"], ["Требования к работе 8/10", "Регламенты и порядок держишь чётко, без напоминаний"]], "growth": [], "recommendations": [{"zone": "Техническая глубина", "method": "Разбирать 1 сложный кейс в неделю до корневой причины", "result": "Рост технической глубины", "deadline": "Окт 2026", "fact": "Системная рекомендация на основе месячных фактов", "ticket": ""}], "awards": [{"id": "legend", "icon": "ph-trophy", "title": "Легенда", "desc": "Средний KPI 9.0+ за месяц", "color": "#fbbf24", "glyph": "🔥"}, {"id": "top", "icon": "ph-crown", "title": "Топ месяца", "desc": "1-е место в рейтинге по среднему KPI", "color": "#22d3ee", "glyph": "🥇"}, {"id": "learning", "icon": "ph-graduation-cap", "title": "Гуру обучения", "desc": "Обучаемость 10/10 — быстро осваивает новое", "color": "#a78bfa", "glyph": "📚"}, {"id": "initiative", "icon": "ph-rocket-launch", "title": "Мастер инициативы", "desc": "Инициатива 10/10 — проактивность и предложения", "color": "#fbbf24", "glyph": "💡"}, {"id": "engagement", "icon": "ph-users-three", "title": "Командный дух", "desc": "Вовлечённость 10/10 — командность и помощь коллегам", "color": "#34d399", "glyph": "🤝"}]}, {"key": "2026-05", "month": "Май 2026", "quality": 9, "learnability": 10, "initiative": 10, "engagement": 10, "discipline": 9, "bonus": null, "money": [], "negatives": [{"value": 0.5, "text": "«Закрытие с гарантией»: повторная заявка по принтеру в Опочке (HELP-384236) — это сигнал: решение не устранило корневую причину. Ты «закрыл тикет», но не «закрыл проблему». В техподдержке это фундаментальная ошибка, которая бьёт по доверию."}, {"value": 0.5, "text": "Прозрачность работы для пользователя: отсутствие внешних комментариев в задачах (примеры в тикетах) создаёт «чёрную дыру». Пользователь не видит прогресс, идёт с вопросом к руководителю. Ты работаешь — но система этого не фиксирует."}, {"value": 0.5, "text": "Риск перегрузки без фокуса: ты хочешь участвовать во всём, и это круто, но без фильтра приоритетов это путь к выгоранию и поверхностным решениям. Энергия без фокуса — это шум, а не результат."}], "positives": [{"value": 1.0, "text": "Бизнес-мышление и стратегический вклад: ты не просто «починил принтер» — ты провёл анализ замен ноутбуков после ребрендинга, вывел статистику, оформил презентацию для бизнеса. Это переход от «исполнителя» к «партнёру», который говорит на языке ценности, а не только техники."}, {"value": 1.0, "text": "Инициатива с экономической оптикой: предложение заменить ноутбуки на моноблоки — это не «техническая идея», это расчёт выгоды для компании. Ты видишь и технику, и экономику — это редкое сочетание, которое бизнес растит в лидеров."}, {"value": 1.0, "text": "Максимальная вовлечённость и обучаемость: ты горишь делом, быстро вникаешь в новое, не боишься сложных задач. Это тот «двигатель», который тянет не только тебя, но и команду вперёд."}], "planTxt": {"title": "Рекомендации для роста", "steps": [{"title": "Внедри «Чек-лист закрытия с гарантией»", "text": "перед сменой статуса в тикете письменно ответь: (1) какая была корневая причина, (2) что именно я сделал, (3) как проверить, что проблема не вернётся. Прогоняй каждую задачу через этот фильтр. Цель: 0 возвратов за июнь.", "result": ""}, {"title": "Правило «30 минут → комментарий»", "text": "если задача не закрыта за 30 минут — оставляй внешний апдейт: «Что сделал → Что мешает → Когда следующее обновление». Это вернёт прозрачность и снимет вопросы у пользователей.", "result": ""}, {"title": "«Фильтр приоритетов»", "text": "когда появляется новая задача или идея — задай вопрос: «Это приносит ценность бизнесу сейчас или может подождать?». Фиксируй ответ в заметке. Это научит тебя брать нагрузку по силам, а не «по желанию».", "result": ""}, {"title": "«Технический час в неделю»", "text": "выдели 60 минут на погружение в один аспект автоматизации (n8n, API, JIRA-триггеры). Фиксируй инсайт и пробуй применить в малом. Это вернёт тебе «руки в коде» и усилит твои предложения.", "result": ""}, {"title": "«Ежемесячный чек-ин по фокусу»", "text": "раз в месяц 15 минут обсуждай со мной: что из текущего действительно зажигает, что можно делегировать, где нужна помощь. Это не отчёт — это способ сохранить энергию и расти в том направлении, где ты максимален.", "result": ""}]}, "mentor": ["Андрей, давай поговорим спокойно и по-деловому. Май показал важную вещь: когда талант встречается с дисциплиной и бизнес-мышлением — рождаются результаты, которые меняют правила игры. Ты не просто «закрываешь тикеты» — ты анализируешь, считаешь экономику, предлагаешь решения на уровне бизнеса. Это уровень выше специалиста техподдержки. Но помни: величие — в деталях. И сейчас важно не позволить мелочам стать тормозом для твоего роста.", "Андрей, ты уже не «просто специалист». Ты человек, который видит картину целиком, считает экономику и предлагает решения на уровне бизнеса. Теперь важно не «брать ещё больше», а «оттачивать то, что уже работает» — в глубине диагностики, в прозрачности, в управлении фокусом.", "Помни: эталон — это не тот, кто никогда не ошибается. Это тот, кто превращает каждую ошибку в систему, которая не даёт её повторить. Ты уже умеешь так работать. Теперь примени это к себе.", "Двигатель работает на полную. Теперь настрой навигацию и защити фокус. Действуй."], "kpi": {"quality": 9, "learnability": 10, "initiative": 10, "engagement": 10, "discipline": 9}, "avg": 9.6, "rank": 1, "strengths": [["Бизнес-мышление и стратегический вклад: ты не просто «починил принтер» — ты провёл анализ замен ноутбуков после ребрендинга, вывел статисти спечиваешь."}, {"value": 1.0, "text": "Тотальная вовлечённость и инициатива: 10/10 по всем ключевым показателям второй месяц подряд. Ты не ждёшь указаний — ты берёшь на себя, разруливаешь сложные ситуации, когда коллеги заняты. Это мышление владельца: «Если не я, то кто?». Именно так рождаются люди, на которых можно положиться в критический момент."}, {"value": 1.0, "text": "Эмоциональный интеллект как инструмент устойчивости: ты чувствуешь нагрузку, умеешь сказать «стоп», сохраняешь позитив и юмор без потери серьёзности. Это редкое качество: быть тёплым, но не мягким; прямым, но не разрушительным. Именно так лидер удерживает команду в фокусе, не создавая напряжения."}], "planTxt": {"title": "Рекомендации для роста", "steps": [{"title": "Внедри «Правило комментария»", "text": "перед переключением на другую задачу оставляй короткий апдейт: «Что сделал → Что дальше → Если нет движения — почему». Не для отчёта. Для команды. Лидер управляет доверием через прозрачность. Это спасёт от вопросов «а что по задаче?».", "result": ""}, {"title": "«Одно техническое предложение в месяц»", "text": "выбери одну рутинную операцию в ребрендинге или обслуживании офисов и предложи конкретное решение: шаблон, скрипт, чек-лист, автоматизацию. Фиксируй: что было → что стало → сколько времени сэкономили. Это мост от исполнителя к архитектору процессов.", "result": ""}, {"title": "«Аудит одного комментария в неделю»", "text": "раз в неделю просматривай свои задачи и спрашивай: «Где я мог оставить комментарий, но не оставил?». Запиши вывод. Это не самобичевание. Это тренировка профессиональной гигиены, которая превратит твою безупречность в исполнение в безупречность в коммуникации.", "result": ""}, {"title": "«Час автоматизации»", "text": "выдели 60 минут в неделю на погружение в один инструмент (JIRA-триггеры, n8n, API). Не «когда будет время», а в календаре. Фиксируй один инсайт и пробуй применить в малом. Это вернёт тебе «руки в коде» и усилит твои предложения.", "result": ""}, {"title":
