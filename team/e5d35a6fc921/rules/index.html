лю. Ты работаешь — но система этого не фиксирует."}, {"value": 0.5, "text": "Риск перегрузки без фокуса: ты хочешь участвовать во всём, и это круто, но без фильтра приоритетов это путь к выгоранию и поверхностным решениям. Энергия без фокуса — это шум, а не результат."}], "positives": [{"value": 1.0, "text": "Бизнес-мышление и стратегический вклад: ты не просто «починил принтер» — ты провёл анализ замен ноутбуков после ребрендинга, вывел статистику, оформил презентацию для бизнеса. Это переход от «исполнителя» к «партнёру», который говорит на языке ценности, а не только техники."}, {"value": 1.0, "text": "Инициатива с экономической оптикой: предложение заменить ноутбуки на моноблоки — это не «техническая идея», это расчёт выгоды для компании. Ты видишь и технику, и экономику — это редкое сочетание, которое бизнес растит в лидеров."}, {"value": 1.0, "text": "Максимальная вовлечённость и обучаемость: ты горишь делом, быстро вникаешь в новое, не боишься сложных задач. Это тот «двигатель», который тянет не только тебя, но и команду вперёд."}], "planTxt": {"title": "Рекомендации для роста", "steps": [{"title": "Внедри «Чек-лист закрытия с гарантией»", "text": "перед сменой статуса в тикете письменно ответь: (1) какая была корневая причина, (2) что именно я сделал, (3) как проверить, что проблема не вернётся. Прогоняй каждую задачу через этот фильтр. Цель: 0 возвратов за июнь.", "result": ""}, {"title": "Правило «30 минут → комментарий»", "text": "если задача не закрыта за 30 минут — оставляй внешний апдейт: «Что сделал → Что мешает → Когда следующее обновление». Это вернёт прозрачность и снимет вопросы у пользователей.", "result": ""}, {"title": "«Фильтр приоритетов»", "text": "когда появляется новая задача или идея — задай вопрос: «Это приносит ценность бизнесу сейчас или может подождать?». Фиксируй ответ в заметке. Это научит тебя брать нагрузку по силам, а не «по желанию».", "result": ""}, {"title": "«Технический час в неделю»", "text": "выдели 60 минут на погружение
