 "result": ""}, {"title": "«Точка выбора»", "text": "честно ответь себе — где ты горишь? В ИТ-диагностике и решении проблем? Или в общении с людьми, стримах, публичной работе? Не надо «разрывать» себя. Выбери одно направление и сфокусируйся на нём. Энергия без фокуса — это шум. Энергия с фокусом — это результат.", "result": ""}, {"title": "«Микро-инициатива в неделю»", "text": "раз в неделю предлагай одно маленькое улучшение (шаблон комментария, чек-лист, заметка в БЗ). Не жди «великой идеи» — начинай с малого. Это мост от исполнителя к специалисту, который меняет процессы.", "result": ""}]}, "mentor": ["Родион, я верю в тебя. Но вера — это не ожидание, что «само наладится». Это готовность действовать, даже когда сложно. Сейчас у тебя есть выбор: продолжить «быть вовлечённым» без фокуса — или взять паузу, честно посмотреть на свои цели и начать менять систему своих действий.", "Ты уже доказал, что можешь приносить результат. Теперь вопрос: хочешь ли ты расти в ИТ-экспертизе — или твой путь лежит в другом направлении? Оба варианта — нормальные. Но нельзя идти в две стороны одновременно."], "kpi": {"quality": 7, "learnability": 6, "initiative": 5, "engagement": 10, "discipline": 7}, "avg": 7.0, "rank": 7, "strengths": [["Максимальная вовлечённость и энергия: ты не прячешься, не молчишь, не ждёшь пинка — ты в игре. Это редкий дар. Когда ты хочешь — ты приносишь результат, и это видно в решённых задачах. Энергия — твой главный актив, если направить её в нужное русло.", "Отмечено руководителем за месяц"], ["Рост технической базы: ты стал реже спрашивать то, что есть в БЗ или Инфо. Это прогресс. Ты учишься, вникаешь, и это фундамент, на котором можно строить экспертизу.", "Отмечено руководителем за месяц"], ["Способность закрывать задачи с измеримой пользой: диагностика и решение проблемы с НК в 1С ТБ (HELP-383083) — это не «просто тикет», это стабильность офиса. Ты умеешь приносить пользу, когда фокусируешься.", "Отмечено руководителем за месяц"], ["Вовлечённость 10/10",
