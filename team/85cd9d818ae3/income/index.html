вые показатели компании, а также ведут к долгосрочному и эффективному партнёрству «сотрудник-компания»", "color": "#fb7185", "glyph": "🎖️", "image": "assets/img/awards/znak-1.png", "degree": 1, "manual": true, "motiv": ""}], "rules": {"stars": [{"icon": "🎖", "kind": "info", "title": "Звёзды начисляет и снимает руководитель ОТП", "text": "С сентября 2026 решение по звёздам принимает руководитель отдела: он видит работу каждого и оценивает вклад целиком. В журнале на «Моём LVL» по каждому месяцу указано, за что именно звезда начислена или снята — догадываться не нужно."}, {"icon": "📈", "kind": "gain", "title": "+1 ⭐ за рост", "text": "Средний KPI за месяц вырос к прошлому месяцу — это первое, на что смотрит руководитель. Устойчивый рост ценится выше разового всплеска."}, {"icon": "🎯", "kind": "gain", "title": "+1 ⭐ за удержание 9.0+", "text": "Держать средний KPI на 9.0 и выше несколько месяцев подряд — отдельное достижение: это про стабильность, а не про один удачный месяц."}, {"icon": "🏅", "kind": "gain", "title": "+1 ⭐ за новую награду", "text": "Первое получение награды — повод для звезды. Исключения: «На старте» и награда ниже уже полученной по показателю KPI (например, была «Развивающийся», а стала «На старте»)."}, {"icon": "🔟", "kind": "gain", "title": "+1 ⭐ за каждые 10 однотипных наград", "text": "Каждые 10 накопленных наград одного вида дают звезду. «На старте» не считается."}, {"icon": "🛠", "kind": "gain", "title": "+1 ⭐ за то, что держится не на словах", "text": "Решения, которые остаются в отделе: автоматизация, регламенты в базе знаний, наставничество, закрытие критичных задач и аварий, готовность выйти в выходной или ночью."}, {"icon": "👔", "kind": "gain", "title": "Решение руководителя — основание", "text": "Отдельная звезда ставится за конкретные заслуги, критически важные для отдела или компании: в журнале всегда написано, за что именно."}, {"icon": "➕", "kind": "info", "title": "Лимита нет", "text": "Основания суммируются и не ограничены: чем больше
