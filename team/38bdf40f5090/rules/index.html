, "negatives": [{"value": 0.5, "text": "Масштабирование личного опыта на команду: Вы создаёте прекрасные схемы и процессы, но вопрос в том, насколько они уже живут в головах и руках ваших специалистов. Если знание остаётся только у вас — это не система, это «единственная точка отказа». Ваша задача — превратить личный экспертный капитал в коллективный актив."}, {"value": 0.5, "text": "Фиксация и тиражирование лучших практик: Отличные предложения по оптимизации графика и ночных задач — это начало. Но идея становится ценностью только тогда, когда она оформлена, измерена и внедрена. Пока этого шага не сделано, потенциал остаётся нереализованным."}], "positives": [{"value": 1.0, "text": "Системное мышление и архитектура процессов: Ваша схема диагностики по 1С ТБ — это эталон. Вы не просто «починили», вы создали алгоритм, который теперь может использовать вся команда. Это переход от ремесла к инженерии: вы строите систему, которая работает без вашего постоянного участия. Именно так рождаются масштабируемые решения."}, {"value": 1.0, "text": "Лидерство через развитие людей: Вы начали не просто управлять специалистами, а обучать их, корректировать, вкладываться в их рост. Это правильный вектор: настоящий руководитель измеряет свой успех не тем, сколько сделал сам, а тем, насколько выросла его команда. Вы идёте по этому пути."}, {"value": 1.0, "text": "Надёжность в операционном контуре: Закрытие офисов в конце месяца, логистика между ЦО и офисами, диагностика — вы берёте на себя критические задачи и доводите их до результата. Это фундамент доверия: когда вы говорите «сделаю», система может на это опереться."}], "planTxt": {"title": "Рекомендации для роста", "steps": [{"title": "Создайте «Библиотеку процессов отдела»", "text": "Возьмите за правило оформлять каждую удачную схему (как по 1С ТБ) в едином формате: цель → шаги → метрики успеха → частые ошибки. Размещайте в Базе Знаний и проводите 15-минутный разбор с командой. Это превратит ваш личный опыт в стандарт работы отдела.", "result": ""}, {"title": "Внедрите «Учебные пятницы»", "text": "Выделите 30 минут раз в неделю на разбор одного процесса с подчинёнными. Не «сделайте вот так», а «давайте вместе разберём, почему это работает». Формат: вы показываете → они повторяют → вы корректируете. Это инвестиция в автономность команды.", "result": ""}, {"title": "Практикуйте «делегирование с контрольными точками»", "text": "Когда передаёте задачу, фиксируйте не только «что сделать», но и «как я проверю результат». Например: «Сделай Х, доложи в 15:00 с комментарием в тикете». Это учит специалистов ответственности, а вам освобождает время для стратегии.", "result": ""}, {"title": "Проведите «аудит замещаемости»", "text": "Раз в месяц задавайте себе вопрос: «Если я уйду в отпуск на две недели, какие процессы встанут?». Выписывайте эти зоны и постепенно готовьте специалистов к их ведению. Это путь от незаменимого исполнителя к архитектору устойчивой системы.", "result": ""}]}, "mentor": ["Владислав, добрый день. Давайте спокойно и по-деловому разберём ваш май. В бизнесе, как и в жизни, важно не только бежать быстро, но и видеть дорогу, по которой бежишь. Вы в этом месяце показали именно это — умение сочетать оперативную работу со стратегическим мышлением.", "Ты уже не просто исполнитель, Влад. Ты — заместитель, и от тебя ждут не только рук, но и головы, и воли. Каждый раз, когда ты ловишь себя на «спросить у Евгения», задай вопрос: «А что я сам могу решить прямо сейчас?». Именно в этом зазоре рождается лидер. Я верю, что ты готов сделать этот шаг — теперь иди и покажи это в деле."], "kpi": {"quality": null, "learnability": null, "initiative": null, "engagement": null, "discipline": null}, "avg": null, "rank": null, "strengths": [["Системное мышление и архитектура процессов: Ваша схема диагностики по 1С ТБ — это эталон. Вы не просто «починили», вы создали алгоритм, который теперь может использовать вся команда. Это переход от ремесла к инженерии: вы строите систему, которая работает без вашего по
