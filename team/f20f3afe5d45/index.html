ь", "type": "Статьи", "url": "https://habr.com/ru/search/?q=тайм-менеджмент", "icon": "ph-globe"}], "status": "active", "history": [{"key": "2026-04", "month": "Апр 2026", "quality": 8, "learnability": 6, "initiative": 8, "engagement": 10, "discipline": 9, "bonus": null, "money": [], "negatives": [], "positives": [], "planTxt": null, "mentor": [], "kpi": {"quality": 8, "learnability": 6, "initiative": 8, "engagement": 10, "discipline": 9}, "avg": 8.2, "rank": 3, "strengths": [["Вовлечённость 10/10", "Командный игрок: на тебя можно положиться, помогаешь коллегам"], ["Качество 8/10", "Задачи делаешь сразу верно — без возвратов и рекламаций"], ["Инициатива 8/10", "Сам берёшь задачи и предлагаешь улучшения — проактивность"], ["Требования к работе 9/10", "Регламенты и порядок держишь чётко, без напоминаний"]], "growth": [], "recommendations": [{"zone": "Обучаемость", "method": "Выделить 2 ч/нед на обучение по согласованному плану", "result": "Рост обучаемости и скорости", "deadline": "Сен 2026", "fact": "Обучаемость сейчас 6/10 — ниже целевых 8", "ticket": ""}, {"zone": "Техническая глубина", "method": "Разбирать 1 сложный кейс в неделю до корневой причины", "result": "Рост технической глубины", "deadline": "Окт 2026", "fact": "Системная рекомендация на основе месячных фактов", "ticket": ""}], "awards": [{"id": "pro", "icon": "ph-medal", "title": "Профи", "desc": "Средний KPI 8.0–8.9", "color": "#cbd5e1", "glyph": "😎"}, {"id": "engagement", "icon": "ph-users-three", "title": "Командный дух", "desc": "Вовлечённость 10/10 — командность и помощь коллегам", "color": "#34d399", "glyph": "🤝"}]}, {"key": "2026-05", "month": "Май 2026", "quality": 6, "learnability": 7, "initiative": 6, "engagement": 10, "discipline": 8, "bonus": null, "money": [], "negatives": [{"value": 0.5, "text": "Качество диагностики и «закрытие с гарантией»: повторные обращения по одним и тем же задачам (Новотроицк, Чаплыгин, Шадринск) — это сигнал: ты не докапываешься до корневой причины. Ты «закрываешь тикет», но не «закрываешь проблему». В техподдержке это фундаментальная ошибка."}, {"value": 0.5, "text": "Прозрачность работы и коммуникация: долгие задачи без внятных комментариев (HELP-382709, HELP-384046), неправильное использование остановки SLA — это создаёт «чёрную дыру» для команды. Коллеги не видят прогресс, супервайзер не может планировать нагрузку."}, {"value": 0.5, "text": "Взаимодействие с руководством и командой: пререкания с супервайзером вместо чёткого ответа «чем занят» — это не защита позиции, это трата времени системы. Лидер не спорит о назначении — он информирует о приоритетах и предлагает решение."}], "positives": [{"value": 1.0, "text": "Максимальная вовлечённость: ты не прячешься, не молчишь, не «отсиживаешь». Ты в игре, и это видно. Энергия — твой главный актив. Когда ты фокусируешься, ты приносишь результат — и это доказано твоими прошлыми периодами."}, {"value": 1.0, "text": "Понимание требований к работе: ты знаешь правила, видишь процессы, способен работать на уровне «почти идеально». Это фундамент, на который можно опереться. Проблема не в незнании — проблема в применении."}, {"value": 1.0, "text": "Обучаемость и прошлый успех: ранее ты показывал и качество, и инициативу. Значит, ты умеешь. Сейчас вопрос не «можешь ли», а «почему перестал». Ответ на этот вопрос — твой ключ к возвращению."}], "planTxt": {"title": "Рекомендации для роста", "steps": [{"title": "Внедри «Чек-лист закрытия с гарантией»", "text": "перед сменой статуса в тикете письменно ответь: (1) какая была корневая причина, (2) что именно я сделал, (3) как проверить, что проблема не вернётся. Прогоняй каждую задачу через этот фильтр. Цель: 0 возвратов за июнь.", "result": ""}, {"title": "Правило «30 минут → комментарий»", "text": "если задача не закрыта за 30 минут — оставляй апдейт: «Что сделал → Что мешает → Когда следующее обновление». Это вернёт прозрачность и снимет вопросы у команды.", "result": ""}, {"title": "«Пауза перед реакцией»", "text": "когда получаешь задачу от
