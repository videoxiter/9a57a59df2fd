us": 70, "money": [{"amount": 70, "text": "оптимизация работы интернет на 2 офисах (смена тарифных планов, подключение проводного подключения и т.д.) - исключение рисков отключения мобильного интернет при атаках БПЛА"}], "negatives": [{"value": 0.5, "text": "Дисциплина в оформлении и статусе задач: пропущенные данные отправителя/получателя (HELP-380428), неверный статус вместо «Ожидание от провайдера» (HELP-383810), отсутствие комментариев при остановке SLA — это не «мелочи», это точки, где система теряет прозрачность. Когда ты работаешь с процессами, каждый твой шаг должен быть эталоном."}, {"value": 0.5, "text": "Эмоциональный интеллект в коммуникации: ты иногда повышаешь голос или допускаешь негативный тон, когда это не требуется. Твой посыл — правильный, но не все считывают его через эмоцию. Лидер управляет не только задачами, но и тем, как его слова воспринимаются."}, {"value": 0.5, "text": "Техническое участие в автоматизации: ты отлично координируешь и обучаешь, но пока мало «заходишь руками» в технические решения. Чтобы предлагать устранение «дыр» в процессах, нужно глубже погружаться в инструменты (JIRA, n8n, API). Иначе есть риск остаться «менеджером процессов», а не стать «архитектором автоматизации»."}], "positives": [{"value": 1.0, "text": "Архитектор процессов и наставник: ты не просто «управляешь» — ты создаёшь дорожные карты (корпоративная связь, ТМЦ, автоматизация), обучаешь коллег методологии, координируешь задачи. Это переход от «сильного исполнителя» к «человеку, который умножает результат через других». Именно так рождаются масштабируемые системы."}, {"value": 1.0, "text": "Лучшая коммуникация в отделе: ты умеешь говорить и с командой, и с другими подразделениями так, чтобы тебя слышали и понимали. Ты не боишься называть проблемы, но сразу предлагаешь решения. Это редкое сочетание: честность + конструктив. На таком фундаменте строится доверие."}, {"value": 1.0, "text": "Готовность к изменениям и системный взгляд: ты легко берёшь новые направления (база знаний, автоматизация), видишь слабые места и предлагаешь, как их закрыть. Ты не «держишься за старое» — ты ищешь, как сделать лучше. Это мышление собственника, а не наёмного специалиста."}], "planTxt": {"title": "Рекомендации для роста", "steps": [{"title": "Внедри «Чек-лист статуса и комментария»", "text": "перед изменением статуса в Jira проверяй: (1) верный тип (Ожидание/SLA стоп/Решено), (2) есть комментарий с причиной и следующим шагом, (3) все согласования зафиксированы. Прогоняй каждую задачу через этот фильтр. Цель: 0 ошибок по статусам и 0 вопросов по оформлению за июнь.", "result": ""}, {"title": "Практикуй «Пауза перед реакцией»", "text": "когда чувствуешь, что растёт раздражение — сделай вдох, задай вопрос: «Что я хочу добиться этим тоном?». Если цель — донести мысль, а не выплеснуть эмоцию, переформулируй. Это не «сдерживать себя», это управлять влиянием.", "result": ""}, {"title": "«Технический час в неделю»", "text": "выдели 60 минут на погружение в один технический аспект автоматизации (например, как работает триггер в n8n или как настроить поле в JIRA). Фиксируй инсайт и пробуй применить в малом. Это вернёт тебе «руки в коде» и усилит твои предложения.", "result": ""}, {"title": "«Еженедельный апдейт по процессам»", "text": "раз в неделю фиксируй кратко: что сделано по дорожным картам, какие метрики сдвинулись, какие препятствия. Отправляй мне и команде. Ритм > перфекционизм. Это усилит доверие к твоему управлению изменениями.", "result": ""}, {"title": "«Аудит коммуникаций раз в две недели»", "text": "просматривай свои сообщения в чатах и тикетах. Спроси: «Был ли я понятен? Не создал ли я лишнего напряжения?». Фиксируй инсайты. Это превратит твою сильную сторону — прямую коммуникацию — в ещё более сильную: ясную и безопасную для команды.", "result": ""}]}, "mentor": ["Павел, давай спокойно и по-деловому. Май показал важную вещь: когда человек с опытом и энергией берёт на себя новые направления — это либо создаёт хаос, либо рождает систему. абые места в JIRA и процессах, но не транслируешь это в конкретные предложения по автоматизации. Почему? Возможно, не хватает времени, а возможно — уверенности в техническом решении. Но система ждёт не «идеального плана», а «первого шага»."}], "positives": [{"value": 1.0, "text": "Тотальная дисциплина результата: Качество 10/10 против 9 в мае, Требования к работе 10/10 против 8. Это не «стало лучше». Это переход в другую лигу. Ты не просто закрываешь задачи — ты создаёшь стандарт, на который равняются другие. Инициатива по актам приёма-передачи ТМЦ, обсуждение рисков с бухгалтерией — это мышление собственника, который видит процесс целиком, а не свой участок."}, {"value": 1.0, "text": "Эмоциональный интеллект как инструмент влияния: в мае ты учился «прятать негатив», в июне — ты уже управляешь тоном, используешь юмор, сохраняешь позитив без потери серьёзности. Это редкое качество: быть тёплым, но не мягким; прямым, но не разрушительным. Именно так лидер удерживает команду в фокусе, не создавая напряжения."}, {"value": 1.0, "text": "Контроль процессов как система: ты не «реагируешь» на проблемы корпоративной связи и ТМЦ — ты их предупреждаешь. Активное участие в обсуждении передачи техники от уволенных сотрудников — это не «ещё одна встреча». Это профилактика рисков, которая экономит компании время и деньги. Ты перешёл от «исполнения» к «упреждению»."}], "planTxt": {"title": "Рекомендации для роста", "steps": [{"title": "Внедри «Технический час лидера»", "text": "выдели 60 минут в неделю на погружение в один технический аспект (JIRA-триггеры, n8n, API-интеграции). Не «когда будет время», а в календаре, как встреча с руководителем. Фиксируй один инсайт и пробуй применить в малом. Это вернёт тебе «руки в коде» и усилит твои предложения.", "result": ""}, {"title": "Практикуй «Менторство по структуре»", "text": "работая с Антоном, используй формат: «Проблема → Как я мыслю → Что делаем → Как проверяем». Не «объяснил и забыл», а «дал инструмент → проверил применение → скор
