о тебе по-настоящему интересно? Ответа нет. Почему? Возможно, ты сам ещё не сформулировал. Но без ответа на этот вопрос ты будешь продолжать «гореть» в одних зонах и «гаснуть» в других. Энергия без фокуса — это шум."}], "positives": [{"value": 1.0, "text": "Качество вышло на эталон: 9/10 против 8 в мае. Это не «немного лучше». Это результат твоего решения — не «просто сделать», а «сделать безупречно». Организация работы практикантов, приёмка техники с закрывшихся офисов, удобная форма отчётности — это не «ещё одна задача». Это системный подход, который экономит время всей команде. Ты перешёл от «исполнения» к «архитектуре процесса»."}, {"value": 1.0, "text": "Инициатива и вовлечённость на максимуме: 10/10 второй месяц подряд. Ты не ждёшь указаний — ты берёшь на себя, организуешь, контролируешь. Это та энергия, которая заряжает команду. Когда ты видишь смысл — ты горишь, и это видно в результате."}, {"value": 1.0, "text": "Системное мышление как актив: ты не «тушишь пожары» — ты создаёшь формы, регламенты, отчётность. Это редкое качество: видеть процесс целиком и упаковывать его в работающий инструмент. Именно так рождаются люди, на которых можно положиться в масштабе."}], "planTxt": {"title": "Рекомендации для роста", "steps": [{"title": "Внедри «Утро/вечер-планирование»", "text": "каждые утро и вечер проходи по всем активным задачам — расставляй приоритеты, фиксируй дедлайны, отмечай «горящие». Используй простую таблицу: «Задача → Срок → Статус → Что мешает». Цель: ноль просрочек старше недели за июль. Это вернёт контроль над временем.", "result": ""}, {"title": "Правило «Делегирование с контролем»", "text": "когда задача не может быть выполнена тобой — передавай её с чётким ТЗ: «Что сделать → Зачем → Срок → Как проверю». Фиксируй в Jira. Это не «сбросил и забыл». Это «передал и контролирую». Это освободит тебе время для системных задач.", "result": ""}, {"title": "«Чек-лист пятницы»", "text": "каждую пятницу 15 минут просматривай свои задачи: какие висят в «В работе» без движения, какие просрочены, где не проставлены метки. Анализируй: «Почему так вышло → Какой триггер поставить, чтобы не забыть». Это тренировка операционной дисциплины.", "result": ""}, {"title": "«Ответ на вопрос интереса»", "text": "выдели 30 минут на этой неделе и честно запиши: что в работе по-настоящему зажигает? Детальная работа с ТМЦ? Оптимизация логистики? Обучение коллег? Пришли мне этот ответ. Без этого шага мы не сможем выстроить твою траекторию роста.", "result": ""}, {"title": "«Одна система в месяц»", "text": "ты умеешь придумывать системы — преврати это в ритм. Раз в месяц бери одну «боль» процесса и предлагай решение: форма, чек-лист, шаблон, автоматизация. Фиксируй: что было → что стало → сколько времени сэкономили. Это мост от специалиста к архитектору процессов.", "result": ""}]}, "mentor": ["Георгий, давай поговорим о парадоксе роста. Июнь показал тебе зеркало, в котором отражается не «ещё один месяц», а фундаментальный выбор: ты растёшь там, где тебя зажигает, и теряешь почву там, где кажется «рутиной». Качество выросло с 8 до 9, инициатива и вовлечённость остались на 10. Но требования к работе просели с 6 до 3. Это не случайность. Это сигнал: твоя энергия идёт в то, что ты любишь, а система ждёт от тебя исполнения и в том, что ты откладываешь. И вопрос не в том, «что сломалось». Вопрос в том, «как вернуть целостность, не потеряв огонь».", "Георгий, я верю в тебя. Но вера — это не ожидание, что «само наладится». Это готовность действовать, даже когда трудно. У тебя есть то, что нельзя научить: системное мышление, энергия, умение организовывать. Теперь добавь к этому дисциплину в «скучном» и смелость делегировать.", "Помни: целостный профессионал — это не тот, кто идеален в любимом. Это тот, кто исполняет и в нелюбимом, потому что понимает: система держится на всех звеньях. Ты уже умеешь строить. Теперь научись держать ритм.", "Не будь «гением систем, который тонет в просрочках». Стань «архитектором, который строит и исполняет». Ты уже сд
