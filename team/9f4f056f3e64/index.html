ility": 8, "initiative": 10, "engagement": 10, "discipline": 3, "bonus": null, "money": [], "negatives": [{"value": 0.5, "text": "Планирование и дисциплина в сроках: задачи висят с апреля, просрочки копятся, фокус теряется. Почему? Ты берёшь на себя много интересного (практиканты, отчётность), а «скучное» (планирование, дедлайны) откладываешь. Но система не делит задачи на «любимые» и «не очень». Она ждёт исполнения. Когда ты игнорируешь «неинтересное», оно начинает игнорировать тебя — в виде рекламаций и потерянного доверия."}, {"value": 0.5, "text": "Отсутствие делегирования: ты не передаёшь то, что не можешь сделать сам, и в итоге задачи накапливаются. Почему? Возможно, недоверие к исполнителям или желание «сделать идеально самому». Но лидер не «тянет всё на себе». Он «строит систему, где результат не зависит от его личного присутствия»."}, {"value": 0.5, "text": "Неопределённость в точке интереса: я спрашивал в мае, спрашиваю в июне — что тебе по-настоящему интересно? Ответа нет. Почему? Возможно, ты сам ещё не сформулировал. Но без ответа на этот вопрос ты будешь продолжать «гореть» в одних зонах и «гаснуть» в других. Энергия без фокуса — это шум."}], "positives": [{"value": 1.0, "text": "Качество вышло на эталон: 9/10 против 8 в мае. Это не «немного лучше». Это результат твоего решения — не «просто сделать», а «сделать безупречно». Организация работы практикантов, приёмка техники с закрывшихся офисов, удобная форма отчётности — это не «ещё одна задача». Это системный подход, который экономит время всей команде. Ты перешёл от «исполнения» к «архитектуре процесса»."}, {"value": 1.0, "text": "Инициатива и вовлечённость на максимуме: 10/10 второй месяц подряд. Ты не ждёшь указаний — ты берёшь на себя, организуешь, контролируешь. Это та энергия, которая заряжает команду. Когда ты видишь смысл — ты горишь, и это видно в результате."}, {"value": 1.0, "text": "Системное мышление как актив: ты не «тушишь пожары» — ты создаёшь формы, регламенты, отчётность. Это редкое к
