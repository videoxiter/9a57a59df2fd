2 офисах (смена тарифных планов, подключение проводного подключения и т.д.) - исключение рисков отключения мобильного интернет при атаках БПЛА"}, {"amount": 100, "text": "ООО МКК \"Тания\" (5 минут) - диагностика и решение проблемы с 1С ТБ (HELP-384825)"}], "negatives": [{"value": 0.5, "text": "Системная невнимательность и нарушение регламентов: пропуск полей в Jira, неверные статусы, незаполненные данные по ТМЦ — это не «мелочи оформления». Это ломает учёт, срывает SLA и создаёт работу другим. Когда исполнитель перестаёт следовать правилам, система начинает давать сбои."}, {"value": 0.5, "text": "Избегание сложных решений и «перенос на завтра»: задачи по реорганизации провайдера (HELP-381837), проблема с доставкой моноблока в Брейтово (HELP-382091) — это примеры, где ты выбрал пассивную позицию. В бизнесе нет «просто перенести»: есть «решить или принять последствия». Блокировка интернета в двух офисах — это цена бездействия."}, {"value": 0.5, "text": "Потеря фокуса на диагностике и качестве: компьютер явно указывал на проблему с диском (HELP-384657), но задача была закрыта после поверхностной проверки. Это сигнал: ты перестал «докапываться до корня». А в техподдержке именно глубина диагностики отличает профессионала от «закрывателя тикетов»."}], "positives": [{"value": 1.0, "text": "Точечная результативность: даже в сложный месяц ты закрыл задачи по оптимизации интернета в двух офисах и решил инцидент с 1С ТБ (HELP-384825). Это доказывает: когда ты фокусируешься, ты приносишь измеримую пользу. Техническая база у тебя есть — это фундамент, на который можно опереться."}, {"value": 1.0, "text": "Опыт в смежных направлениях: ты работаешь и в техподдержке, и в корпоративной связи, замещаешь коллегу. Это редкая возможность видеть процессы шире, чем «просто тикеты». Такой кросс-функциональный опыт — твой стратегический актив, если им правильно распорядиться."}, {"value": 1.0, "text": "Прошлые достижения как доказательство потенциала: ранее ты показывал и качество, и инициативу. Значит, ты способен на высокий результат. Сейчас важно не «вспомнить, как было», а понять: что изменилось в системе твоих действий — и вернуть контроль."}], "planTxt": {"title": "Рекомендации для роста", "steps": [{"title": "Внедри «Чек-лист закрытия задачи»", "text": "перед сменой статуса в Jira обязательно ответь письменно: (1) все ли поля заполнены (отправитель, получатель, ТМЦ), (2) проведена ли полная диагностика, (3) зафиксирован ли результат комментарием. Прогоняй каждую задачу через этот фильтр. Цель: 0 ошибок по полям и 0 возвратов за июнь.", "result": ""}, {"title": "Проведи «Разбор полётов» по майским ошибкам", "text": "выдели 1 час, возьми 3–5 задач с рекламациями и честно ответь: «На каком этапе я принял решение не решать? Что меня остановило?». Запиши выводы. Это не самобичевание, это системная работа над причиной, а не следствием.", "result": ""}, {"title": "Верни себе «право на вопрос»", "text": "если ты чувствуешь, что теряешь интерес или фокус — скажи об этом руководителю. Не «всё нормально», а «мне сейчас сложно, давайте разберёмся». В сильной команде честность ценится выше, чем имитация благополучия. Я готов помочь — но только если ты откроешься.", "result": ""}, {"title": "Начни с малого", "text": "выбери одну зону (например, заполнение полей в задачах по замене техники) и сделай её своим «эталоном качества» на две недели. Доведи до автоматизма. Маленькая победа вернёт уверенность и запустит положительную динамику.", "result": ""}, {"title": "Найди «точку интереса»", "text": "ответь себе честно — что в работе по-прежнему зажигает? Может, это диагностика, или общение с пользователями, или аналитика? Сфокусируйся на этом элементе, углуби экспертизу. Энергия возвращается через смысл, а не через давление.", "result": ""}]}, "mentor": ["Алексей, давайте поговорим спокойно и по существу. В бизнесе, как и в спорте, бывают периоды спада. Это нормально. Но чемпион отличается от любителя тем, что в момент спада он не ищет оправданий, а смотрит правде в глаза и меняет систему своих действий. Твой май — это сигнал. Не приговор, а именно сигнал: что-то в твоей системе дало сбой. И сейчас важно не «отчитаться», а понять причину и вернуться на траекторию роста.", "Лёша, я верю в тебя. Но вера — это не ожидание, что «само наладится». Это готовность действовать, даже когда трудно. Сейчас у тебя есть выбор: продолжить плыть по течению и позволить ошибкам накапливаться — или взять паузу, честно посмотреть на систему своих действий и начать менять её шаг за шагом.", "Ты уже был на уровне, где качество и инициатива были твоими сильными сторонами. Значит, ты можешь туда вернуться. Вопрос не в способностях — вопрос в решении. Прими его. И начни с малого: с одного чек-листа, одного честного разговора, одной задачи, закрытой безупречно.", "Бизнес уважает тех, кто умеет подниматься после спада. Покажи, что ты — из их числа. Действуй."], "kpi": {"quality": 6, "learnability": 6, "initiative": 5, "engagement": 6, "discipline": 7}, "avg": 6.0, "rank": 9, "strengths": [["Точечная результативность: даже в сложный месяц ты закрыл задачи по оптимизации интернета в двух офисах и решил инцидент с 1С ТБ (HELP-384825). Это доказывает: когда ты фокусируешься, ты приносишь измеримую пользу. Техническая база у тебя есть — это фундамент, на который можно опереться.", "Отмечено руководителем за месяц"], ["Опыт в смежных направлениях: ты работаешь и в техподдержке, и в корпоративной связи, замещаешь коллегу. Это редкая возможность видеть процессы шире, чем «просто тикеты». Такой кросс-функциональный опыт — твой стратегический актив, если им правильно распорядиться.", "Отмечено руководителем за месяц"], ["Прошлые достижения как доказательство потенциала: ранее ты показывал и качество, и инициативу. Значит, ты способен на высокий результат. Сейчас важно не «вспомнить, как было», а понять: что изменилось в системе твоих действий — и вернуть контроль.", "Отмечено руководителем за месяц"]], "growth": [{"zone": "Системная невнимательность и нарушен даментальная ошибка, которая бьёт по доверию."}, {"value": 0.5, "text": "Дисциплина в деталях и регламентах: неверный инвентарный номер, неправильный формат имени пользователя, пропущенные типы запросов при назначении задач — это не «формальности». Это точки, где система теряет прозрачность. Когда ты работаешь с процессами, каждый шаг должен быть эталоном."}, {"value": 0.5, "text": "Пассивность в инициативах и развитии: ты выполняешь задачи, но не предлагаешь улучшений, не делишься инсайтами, не включаешься в развитие отдела. Бизнес ценит не только «сделал», но и «предложил, как сделать лучше». Пока ты молчишь — твой потенциал остаётся нереализованным."}], "positives": [{"value": 1.0, "text": "Точечная результативность в «поле»: ты закрываешь задачи, которые требуют технической хватки — видеонаблюдение, сетевые адаптеры, настройка телефонии, подготовка нового офиса. Это не «просто тикеты». Это стабильность бизнеса, и ты это обеспечиваешь. Когда ты фокусируешься — ты приносишь измеримую пользу."}, {"value": 1.0, "text": "Гибкость и кросс-функциональность: ты работаешь и в техподдержке, и в корпоративной связи, замещаешь коллегу. Это редкая возможность видеть процессы шире, чем «просто ремонт». Такой опыт — твой стратегический актив, если им правильно распорядиться."}, {"value": 1.0, "text": "Конструктивность в команде: ты без пререканий решил с Сергеем вопрос по премированию — это сигнал, что тебе не всё равно. Ты умеешь слышать коллег и находить решение. Это фундамент доверия, на котором можно строить рост."}], "planTxt": {"title": "Рекомендации для роста", "steps": [{"title": "Внедри «Чек-лист закрытия с гарантией»", "text": "перед сменой статуса в тикете письменно ответь: какая была корневая причина, что именно я сделал, как проверить, что проблема не вернётся. Прогоняй каждую задачу через этот фильтр. Цель: ноль возвратов за июль. Это превратит твою техническую базу в безупречный результат.", "result": ""}, {"title": "Правило «Три проверки перед отправкой»", "text": "перед тем как зафиксировать данные в системе (инвентарный номер, имя пользователя, тип запроса), остановись на десять секунд и проверь: соответствует ли это регламенту. Это не «перфекционизм». Это профессиональная гигиена, которая спасает от рекламаций.", "result": ""}, {"title": "«Одна идея в неделю»", "text": "раз в неделю предлагай одно микро-улучшение — шаблон комментария, заметка в Базе Знаний, чек-лист для коллег. Не жди «великой идеи». Начинай с малого, но регулярно. Это мост от исполнителя к специалисту, который меняет процессы.", "result": ""}, {"title": "«Право на вопрос»", "text": "если ты не понимаешь задачу, регламент или приоритет — говори сразу. Не «сделаю как-нибудь», а «помоги разобраться». В сильной команде честность ценится выше, чем имитация уверенности. Это не слабость. Это зрелость.", "result": ""}, {"title": "«Точка интереса»", "text": "честно ответь себе — что в работе по-настоящему зажигает? Диагностика? Коммуникация с пользователями? Аналитика? Выбери одно направление на ближайшие три месяца и сфокусируйся на нём. Энергия без фокуса — это шум. Энергия с фокусом — это результат.", "result": ""}]}, "mentor": ["Алексей, давай поговорим о выборе. Не о том, что ты сделал в июне, а о том, кем ты выбираешь быть. Потому что результаты — это не случайность. Это отражение твоего внутреннего состояния. Июнь показал интересную динамику: с одной стороны — конкретные бонусы за видеонаблюдение, телефонию, подготовку нового офиса. С другой — рекламации, ошибки в полях, пассивность в инициативах. Это не «плохой месяц». Это зеркало. И вопрос не в том, «что не так». Вопрос в том, «что ты выбираешь делать с этой информацией».", "Алексей, я верю в тебя. Но вера — это не ожидание, что «само наладится». Это готовность действовать, даже когда трудно. У тебя есть то, что нельзя научить: техническая база, гибкость, умение слышать коллег. Теперь добавь к этому дисциплину в мелочах и проактивность в инициативах.", "Помни: профессионал — это не тот, кто никогда не ошибается. Это тот, кто превращает каждую ошибку в правило, которое не даёт её повторить. Ты уже умеешь так работать в ремонте. Теперь примени это к процессам.", "Не будь «исполнителем, который ждёт указаний». Стань «специалистом, который создаёт ценность». Ты уже сделал первый шаг — признал, что есть над чем работать. Теперь сделай второй: начни действовать системно.", "Ты готов к этому? Тогда действуй. Не как пассивный участник. Как автор своего результата."], "kpi": {"quality": 7, "learnability": 6, "initiative": 5, "engagement": 7, "discipline": 6}, "avg": 6.2, "rank": 9, "strengths": [["Точечная результативность в «поле»: ты закрываешь задачи, которые требуют технической хватки — видеонаблюдение, сетевые адаптеры, настройка телефонии, подготовка нового офиса. Это не «просто тикеты». Это стабильность бизнеса, и ты это обеспечиваешь. Когда ты фокусируешься — ты приносишь измеримую пользу.", "Отмечено руководителем за месяц"], ["Гибкость и кросс-функциональность: ты работаешь и в техподдержке, и в корпоративной связи, замещаешь коллегу. Это редкая возможность видеть процессы шире, чем «просто ремонт». Такой опыт — твой стратегический актив, если им правильно распорядиться.", "Отмечено руководителем за месяц"], ["Конструктивность в команде: ты без пререканий решил с Сергеем вопрос по премированию — это сигнал, что тебе не всё равно. Ты умеешь слышать коллег и находить решение. Это фундамент доверия, на котором можно строить рост.", "Отмечено руководителем за месяц"]], "growth": [{"zone": "«Закрытие с гарантией»: рекламация по VPN (HELP-384945, HELP-386226) — это не «м", "advice": "«Закрытие с гарантией»: рекламация по VPN (HELP-384945, HELP-386226) — это не «мелкая недоработка». Это сигнал: ты не докапываешься до корневой причины. Ты «закрыл тикет», но не «закрыл проблему». В техподдержке это фундаментальная ошибка, которая бьёт по доверию.", "fact": ""}, {"zone": "Дисциплина в деталях и регламентах: неверный инвентарный номер, неправильный фор", "advice": "Дисцип
