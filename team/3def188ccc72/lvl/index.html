лнение SLA командой».", "example": "Фактические начисления отдела: 19 месяцев с этой категорией, суммы от 1 000 ₽ до 9 000 ₽."}, {"icon": "🌙", "title": "Смены вне графика: ночные, выходные, замещение", "text": "Оплачивается каждая смена отдельно: ночная смена, дневная выходная смена, замещение коллеги в выходной. Ставка умножается на количество смен за месяц.", "example": "Из итогов: ночная смена — 4 000 ₽ за смену, дневная выходная — 3 000 ₽ за смену, замещение — 3 000 ₽. Пример: 4 ночные смены = 11 580 ₽."}, {"icon": "💰", "title": "Продажа списанной техники", "text": "Премия за продажу морально устаревшего оборудования вместо списания: процент от суммы продажи (МФУ, ноутбуки, мониторы, память, диски).", "example": "Из итогов: ноутбук за 11 000 ₽ → 1 100 ₽ премии, МФУ за 2 500 ₽ → 250 ₽, память за 2 000 ₽ → 200 ₽. Ориентир — около 10% от суммы продажи."}, {"icon": "📶", "title": "Оптимизация связи и интернета в офисах", "text": "Перевод офисов с мобильного канала на проводной, смена тарифных планов, сокращение ежемесячных расходов на корпоративную связь — премия за снижение постоянных затрат отдела.", "example": "Из итогов: 2 офиса — 400 ₽, 3 офиса — 170 ₽, 4 офиса — 405 ₽, 6 офисов — 600 ₽; экономия 600 ₽/мес на связи → 150 ₽."}, {"icon": "🧩", "title": "Точечные задачи и проекты", "text": "Отдельные работы сверх графика: диагностика и решение проблем на офисах (включая запросы ООО МКК «Тания»), инвентаризация и обустройство складов ОТП, разработка и внедрение автоматизации.", "example": "Из итогов: 1 час работ — 1 000 ₽, 40 минут — 900 ₽, 20 минут — 400 ₽, 5–10 минут — 100 ₽; склады ОТП ЦО — 5 000 ₽; автоматизация диагностики — 1 500 ₽."}, {"icon": "🚗", "title": "Транспортные расходы и компенсации", "text": "Компенсация дороги и логистики (доставка оборудования и документов между офисами) и компенсация инструментов, которые ты используешь в работе.", "example": "Из итогов: логистика ЦО ↔ Архангельск — 4 000 ₽, транспортные расходы — 2 000 ₽, компенсация ИИ-инструментов — 2 000 ₽."}, {"icon": "📌", "title": "Важно", "text": "Размер каждой выплаты подтверждает руководитель отдела, суммы в примерах — фактические начисления отдела за май–август 2026 (источник — итоги по сотрудникам). Итоговая сумма месяца собирается из этих категорий и видна на странице «Бонусы».", "example": ""}], "months": ["Апр 2026", "Май 2026", "Июн 2026", "Июл 2026", "Авг 2026", "Сен 2026"], "totalEmployees": 10, "team": {"profileByMonth": {"2026-04": [7.38, 7.62, 8.25, 8.88, 7.0], "2026-05": [7.67, 7.78, 7.44, 8.78, 7.33], "2026-06": [7.78, 7.33, 7.89, 9.33, 7.0], "2026-07": [8.33, 8.22, 8.22, 9.56, 7.67], "2026-08": [7.78, 8.56, 9.22, 9.67, 7.22], "2026-09": [8.56, 8.33, 9.33, 9.67, 7.67]}, "avgByMonth": {"2026-04": 7.83, "2026-05": 7.8, "2026-06": 7.87, "2026-07": 8.4, "2026-08": 8.49, "2026-09": 8.71}, "memberCount": 9, "updated": "Сен 2026"}, "leaderboard": [], "employee": {"id": "melnikov", "slug": "3def188ccc72", "fullName": "Мельников Алексей Сергеевич", "shortName": "Алексей", "role": "Специалист ТП (корп. связь, замещение)", "siteTitle": "Надёжный резерв", "tagline": "Замещает, подхватывает, держит SLA.", "personal": "Ты надёжный. Следующий шаг — не молчать о проблемах, а сообщать сразу и контролировать задачи до конца.", "status": "active", "history": [{"key": "2026-04", "month": "Апр 2026", "quality": 7, "learnability": 7, "initiative": 7, "engagement": 7, "discipline": 7, "bonus": 635, "stars_ot": null, "stars_reason": "", "awards_ot": [], "money": [{"amount": 135, "text": "оптимизация работы интернет на 4 офисах (смена тарифных планов, подключение проводного подключения и т.д.) - исключение рисков отключения мобильного интернет при атаках БПЛА;"}, {"amount": 100, "text": "ООО МКК \"Тания\" (5 минут) - диагностика и решение проблемы с Яндекс Телемост на оф.Макеевка Пушка (HELP-382358);"}, {"amount": 200, "text": "ООО МКК \"Тания\" (10 минут) - диагностика и решение проблемы с веб-камерой на оф.Макеевка Пушка (HELP-382358);"}, {"amount": 100, "te text": "Избегание сложных решений и «перенос на завтра»: задачи по реорганизации провайдера (HELP-381837), проблема с доставкой моноблока в Брейтово (HELP-382091) — это примеры, где ты выбрал пассивную позицию. В бизнесе нет «просто перенести»: есть «решить или принять последствия». Блокировка интернета в двух офисах — это цена бездействия."}, {"value": 0.5, "text": "Потеря фокуса на диагностике и качестве: компьютер явно указывал на проблему с диском (HELP-384657), но задача была закрыта после поверхностной проверки. Это сигнал: ты перестал «докапываться до корня». А в техподдержке именно глубина диагностики отличает профессионала от «закрывателя тикетов»."}], "positives": [{"value": 1.0, "text": "Точечная результативность: даже в сложный месяц ты закрыл задачи по оптимизации интернета в двух офисах и решил инцидент с 1С ТБ (HELP-384825). Это доказывает: когда ты фокусируешься, ты приносишь измеримую пользу. Техническая база у тебя есть — это фундамент, на который можно опереться."}, {"value": 1.0, "text": "Опыт в смежных направлениях: ты работаешь и в техподдержке, и в корпоративной связи, замещаешь коллегу. Это редкая возможность видеть процессы шире, чем «просто тикеты». Такой кросс-функциональный опыт — твой стратегический актив, если им правильно распорядиться."}, {"value": 1.0, "text": "Прошлые достижения как доказательство потенциала: ранее ты показывал и качество, и инициативу. Значит, ты способен на высокий результат. Сейчас важно не «вспомнить, как было», а понять: что изменилось в системе твоих действий — и вернуть контроль."}], "planTxt": {"title": "Рекомендации для роста", "steps": [{"title": "Внедри «Чек-лист закрытия задачи»", "text": "перед сменой статуса в Jira обязательно ответь письменно: (1) все ли поля заполнены (отправитель, получатель, ТМЦ), (2) проведена ли полная диагностика, (3) зафиксирован ли результат комментарием. Прогоняй каждую задачу через этот фильтр. Цель: 0 ошибок по полям и 0 возвратов за июнь.", "result": ""}, {"title": "Проведи «Разбор полётов» по майским ошибкам", "text": "выдели 1 час, возьми 3–5 задач с рекламациями и честно ответь: «На каком этапе я принял решение не решать? Что меня остановило?». Запиши выводы. Это не самобичевание, это системная работа над причиной, а не следствием.", "result": ""}, {"title": "Верни себе «право на вопрос»", "text": "если ты чувствуешь, что теряешь интерес или фокус — скажи об этом руководителю. Не «всё нормально», а «мне сейчас сложно, давайте разберёмся». В сильной команде честность ценится выше, чем имитация благополучия. Я готов помочь — но только если ты откроешься.", "result": ""}, {"title": "Начни с малого", "text": "выбери одну зону (например, заполнение полей в задачах по замене техники) и сделай её своим «эталоном качества» на две недели. Доведи до автоматизма. Маленькая победа вернёт уверенность и запустит положительную динамику.", "result": ""}, {"title": "Найди «точку интереса»", "text": "ответь себе честно — что в работе по-прежнему зажигает? Может, это диагностика, или общение с пользователями, или аналитика? Сфокусируйся на этом элементе, углуби экспертизу. Энергия возвращается через смысл, а не через давление.", "result": ""}]}, "mentor": ["Алексей, давайте поговорим спокойно и по существу. В бизнесе, как и в спорте, бывают периоды спада. Это нормально. Но чемпион отличается от любителя тем, что в момент спада он не ищет оправданий, а смотрит правде в глаза и меняет систему своих действий. Твой май — это сигнал. Не приговор, а именно сигнал: что-то в твоей системе дало сбой. И сейчас важно не «отчитаться», а понять причину и вернуться на траекторию роста.", "Лёша, я верю в тебя. Но вера — это не ожидание, что «само наладится». Это готовность действовать, даже когда трудно. Сейчас у тебя есть выбор: продолжить плыть по течению и позволить ошибкам накапливаться — или взять паузу, честно посмотреть на систему своих действий и начать менять её шаг за шагом.", "Ты уже был на уровне, где качество и инициатива были твоими сильными сторонами. Значит, ты можешь туда вернуться. Вопрос не в способностях — вопрос в решении. Прими его. И начни с малого: с одного чек-листа, одного честного разговора, одной задачи, закрытой безупречно.", "Бизнес уважает тех, кто умеет подниматься после спада. Покажи, что ты — из их числа. Действуй."], "kpi": {"quality": 6, "learnability": 6, "initiative": 5, "engagement": 6, "discipline": 7}, "avg": 6.0, "rank": 9, "strengths": [["Точечная результативность: даже в сложный месяц ты закрыл задачи по оптимизации интернета в двух офисах и решил инцидент с 1С ТБ (HELP-384825). Это доказывает: когда ты фокусируешься, ты приносишь измеримую пользу. Техническая база у тебя есть — это фундамент, на который можно опереться.", "Отмечено руководителем за месяц"], ["Опыт в смежных направлениях: ты работаешь и в техподдержке, и в корпоративной связи, замещаешь коллегу. Это редкая возможность видеть процессы шире, чем «просто тикеты». Такой кросс-функциональный опыт — твой стратегический актив, если им правильно распорядиться.", "Отмечено руководителем за месяц"], ["Прошлые достижения как доказательство потенциала: ранее ты показывал и качество, и инициативу. Значит, ты способен на высокий результат. Сейчас важно не «вспомнить, как было», а понять: что изменилось в системе твоих действий — и вернуть контроль.", "Отмечено руководителем за месяц"]], "growth": [{"zone": "Сроки и SLA", "advice": "Контролировать сроки: SLA-напоминания за 24 ч + эскалация при риске просрочки", "fact": "Системная невнимательность и нарушение регламентов: пропуск полей в Jira, неверные статусы, незаполненные данные по ТМЦ — это не «мелочи оформления». Это ломает учёт, срывает SLA и создаёт работу другим. Когда исполнитель перестаёт следовать правилам, система начинает давать сбои.", "ticket": ""}, {"zone": "Технические навыки", "advice": "Прокачать базовую диагностику (сеть, печать, ОС) на практике/курсе", "fact": "Избегание сложных решений и «перенос на завтра»: задачи по реорганизации провайдера (HELP-381837), п
