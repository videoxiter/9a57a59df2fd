# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: workspace-write
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      llmux:
        displayName: llmux
        apiKeyEnv: LLMUX_API_KEY
        api: openai-completions
        baseURL: https://llmux.centrofinans.ru/v1
        models:
          - id: Qwen3.6-35B-A3B
            name: Qwen3.6-35B-A3B
          - id: Qwen3.8-27B
            name: Qwen3.8-27B
          - id: bge-m3
            name: bge-m3
          - id: silero-tts
            name: silero-tts
          - id: silero_vad_v5
            name: silero_vad_v5
          - id: whispr
            name: whispr

- insert:
    - id: stand
      name: dsh-stand
      config:
        envFile: 'G:\LMStudio\dsh-workspace\Main\.secrets\hermes.env'
        registryFile: 'G:\LMStudio\dsh-workspace\Main\.secrets\registry.yaml'
        auditFile: 'G:\LMStudio\dsh-home\state\secrets-audit.log'
        dbFile: 'G:\LMStudio\dsh-home\state\accounting.db'
        rateFile: 'G:\LMStudio\dsh-home\state\cbr-usd.json'
        snapshotScript: 'G:\LMStudio\dsh-workspace\Main\tools\snapshot-state.py'
        snapshotPython: 'C:\Python313\python.exe'
        snapshotIntervalMs: 300000
    - id: stand-themes
      name: dsh-stand-themes

- insert:
    - id: mcp-brain
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: brain
        transport: stdio
        command: 'C:\Python313\python.exe'
        args: [ 'G:\LMStudio\dsh-workspace\Main\memory\brain\server.py' ]
        env:
          DSH_HOME: 'G:\LMStudio\dsh-home'
          DSH_STAND_WORKSPACE: 'G:\LMStudio\dsh-workspace\Main'
          PYTHONIOENCODING: utf-8
- id: tool-fs
  disabled: false
- id: tool-fs-search
  disabled: false
- id: fs-observation-policy
  disabled: false
- id: tool-pwsh
  disabled: false
- id: bash-sandbox
  disabled: true
- id: tool-jobs
  disabled: false
- id: tool-todo
  disabled: false
- id: tool-web
  disabled: false
- id: tool-plugin-manager
  disabled: false
- id: tool-skill
  disabled: false
- id: skill-filesystem
  disabled: false
- id: agent-instructions
  disabled: false
- id: command-goal
  disabled: false
- id: plan-mode
  disabled: false
- id: tool-goal
  disabled: false
- id: compaction-basic
  disabled: false
- id: command-compact
  disabled: false
- id: tool-result-pruner
  disabled: false
- id: tool-subagent-control
  disabled: false
- id: workflow-ptc
  disabled: false
- id: tool-workflow
  disabled: false
- id: tool-subagent
  disabled: false
- id: tool-subagent-fork
  disabled: false
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: llmux
    model: Qwen3.8-27B
- id: genui
  name: dsh-genui
  config:
    sectionOrder: 80
    sectionName: genui:cards
    promptMode: off
    promptEnabled: false
